---
- name: Configuración base de servidores Linux
  hosts: linux
  become: true
  vars:
    paquetes_base:
      - curl
      - vim
      - htop
      - ufw
      - chrony
      - fail2ban
  tasks:
    - name: Actualizar índice de paquetes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar paquetes base
      ansible.builtin.apt:
        name: "{{ paquetes_base }}"
        state: present

    - name: Configurar zona horaria
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Permitir SSH en UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Activar UFW y denegar entrada por defecto
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Deshabilitar login de root por SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: PermitRootLogin no
        validate: /usr/sbin/sshd -t -f %s
      notify: Reiniciar sshd

    - name: Asegurar fail2ban activo
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

  handlers:
    - name: Reiniciar sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
