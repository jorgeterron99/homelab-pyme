---
- name: Agente de Zabbix en servidores Linux
  hosts: linux
  become: true
  tasks:
    - name: Instalar agente de Zabbix
      ansible.builtin.apt:
        name: zabbix-agent
        state: present
        update_cache: true

    - name: Configurar servidor de Zabbix
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
      notify: Reiniciar agente de Zabbix

    - name: Configurar servidor activo de Zabbix
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
      notify: Reiniciar agente de Zabbix

    - name: Configurar nombre del equipo en Zabbix
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
      notify: Reiniciar agente de Zabbix

    - name: Permitir el agente desde el servidor de Zabbix
      community.general.ufw:
        rule: allow
        port: "10050"
        proto: tcp
        from_ip: "{{ zabbix_server_ip }}"

    - name: Asegurar agente activo
      ansible.builtin.service:
        name: zabbix-agent
        state: started
        enabled: true

  handlers:
    - name: Reiniciar agente de Zabbix
      ansible.builtin.service:
        name: zabbix-agent
        state: restarted
